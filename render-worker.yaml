# Solo il servizio separato "tempo reale" (lettura continua dei nuovi annunci).
# 16/11 (ramo fond-auto, punto 3): il worker valuta e pubblica con la STESSA configurazione del sito. Prima riceveva
# solo DATABASE_URL: niente chiave AI (le valutazioni uscivano senza il controllo del giudice), lettore spento,
# TR_SUBITO_SENZA_NUMERO mancante (il sito ce l'ha a 1), SOGLIE_PV e interruttori diversi → CONFIG_IMPRONTA diversa.
# Ogni variabile qui sotto è un RIFERIMENTO a quella del servizio web "scovo" (fromService): nessun valore e nessun
# segreto in questo file; se si cambia una variabile sul sito, il worker la riprende al deploy successivo.
# Elenco ricavato dalla riga CONFIG_IMPRONTA del sito del 16/11 (variabili impostate, non "<default>"), più la chiave
# AI e il sale delle targhe (stessi hash delle targhe del sito). NON si passano le variabili della sola raccolta a
# pagamento (BRIGHTDATA_*, SCRAPER_PROXY): il worker legge come prima, nessuna spesa nuova di proxy.
# Unica eccezione voluta: TR_SUBITO (sul sito "0") NON si copia: è la lettura COMPLETA di Subito, che oggi fa solo il
# worker (default "1"); copiarla toglierebbe annunci invece di aggiungerne. Decide il cliente (vedi FOND_AUTO.md).
# Da applicare con un sync del Blueprint (a mano, dopo la revisione): questo ramo non fa deploy.
services:
  - type: worker
    name: scovo-tempo-reale
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dealfinder.pipeline.tempo_reale_worker
    envVars:
      - key: DATABASE_URL
        fromService: { type: cron, name: dealfinder-opportunita, envVarKey: DATABASE_URL }
      # segreti: solo riferimenti, mai valori
      - key: ANTHROPIC_API_KEY
        fromService: { type: web, name: scovo, envVarKey: ANTHROPIC_API_KEY }
      - key: PLATE_SALT
        fromService: { type: web, name: scovo, envVarKey: PLATE_SALT }
      # regole, interruttori e soglie del sito (CONFIG_IMPRONTA del web, 16/11)
      - key: AI_BUDGET_GIORNO
        fromService: { type: web, name: scovo, envVarKey: AI_BUDGET_GIORNO }
