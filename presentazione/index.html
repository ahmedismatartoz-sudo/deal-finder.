<style>
/* Layout: una scheda per schermata, come un listino da piazzale; foto a sinistra, numeri a destra */
:root{--bg:#0e1114;--panel:#161b20;--line:#262e36;--fg:#eef2f5;--muted:#93a1ad;--accent:#ffd23f;--good:#3ddc97;--warn:#ffb347;--risk:#ff6b5e;

*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--body)}
.deck{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}
.slide{min-height:100%;scroll-snap-align:start;display:grid;align-items:center;padding:48px max(16px,4vw) 72px;border-bottom:1px solid var(--line)}
.inner{max-width:1240px;width:100%;margin:0 auto;min-width:0}
.eyebrow{font:600 .8rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

h2{font:700 clamp(1.7rem,3.2vw,2.6rem)/1 var(--disp);margin:.2em 0 .1em;text-transform:uppercase;text-wrap:balance}
p{line-height:1.55;color:var(--muted);max-width:65ch}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.stat{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:14px 18px;min-width:150px}
.stat b{display:block;font:700 2.2rem/1 var(--disp);color:var(--fg)}.stat span{color:var(--muted);font-size:.85rem}
.car{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(20px,3vw,44px);align-items:start}
@media (max-width:860px){.car{grid-template-columns:1fr}}
.photos{display:grid;gap:10px}
.ph{position:relative;height:50vh;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.small{height:22vh}
@media (max-width:860px){.ph{height:32vh}.ph.small{display:none}}
.ph .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.9rem;text-align:center;padding:16px}
.tag{position:absolute;top:12px;left:12px;background:var(--accent);color:#111;font:700 1rem var(--disp);padding:4px 10px;border-radius:3px;letter-spacing:.03em}
.meta{color:var(--muted);font-size:1rem;margin:.3em 0 1em}
.price{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.price div{background:var(--panel);padding:12px 14px}
.price small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.price b{font:600 1.35rem var(--mono);font-variant-numeric:tabular-nums}
.margin{margin:16px 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.margin b{font:800 clamp(2.6rem,5vw,3.8rem)/1 var(--disp);color:var(--good)}
.margin span{color:var(--muted)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.badge{border:1px solid var(--line);border-radius:3px;padding:3px 9px;font-size:.8rem;font-weight:600}
.b-nessuno{color:var(--good);border-color:var(--good)}.b-leggero{color:var(--fg)}.b-medio{color:var(--warn);border-color:var(--warn)}.b-alto_rischio{color:var(--risk);border-color:var(--risk)}
.b-op{background:var(--good);color:#0b1a12;border-color:var(--good)}.b-dv{color:var(--warn);border-color:var(--warn)}
.list{margin:10px 0 0;padding:0;list-style:none;font-size:.92rem;display:grid;gap:4px}
.list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:3px 0}
.list li span:last-child{font-family:var(--mono);white-space:nowrap;color:var(--muted)}
h4{margin:16px 0 4px;font:600 .75rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.checks{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:.9rem;line-height:1.5}
a.btn{display:inline-block;margin-top:16px;background:var(--accent);color:#111;text-decoration:none;font:700 1.05rem var(--disp);letter-spacing:.04em;padding:9px 16px;border-radius:4px;text-transform:uppercase}
a.btn:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.nav{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;background:rgba(14,17,20,.9);border:1px solid var(--line);border-radius:6px;padding:6px 8px;z-index:5}
.nav button{background:none;border:0;color:var(--fg);font:700 1.2rem var(--disp);cursor:pointer;padding:4px 10px}
.nav span{font:500 .85rem var(--mono);color:var(--muted);min-width:56px;text-align:center}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
.method div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.method b{font:700 1.3rem var(--disp);text-transform:uppercase;display:block;margin-bottom:6px}
.method p{margin:0;font-size:.95rem}
.section h1{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.deck{scroll-behavior:smooth}}
</style></head><body><main class="deck" id="deck"></main>
