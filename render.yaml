# Configurazione Render (Blueprint). Non attiva finché non viene approvata su Render.
databases:
  - name: dealfinder-db
    databaseName: dealfinder
    plan: basic-256mb
    region: frankfurt

services:
  # Raccolta opportunità: ogni 3 ore (orari UTC)
  - type: cron
    name: collect-opportunita
    runtime: python
    region: frankfurt
    schedule: "7 */3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dealfinder.pipeline.collect opportunita
    envVars: &env
      - key: DATABASE_URL
        fromDatabase: { name: dealfinder-db, property: connectionString }
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: META_PROVIDER_TOKEN
        sync: false
      - key: META_ACTOR_ID
        sync: false
      - key: SCRAPER_PROXY
        sync: false
      - key: PLATE_SALT
        generateValue: true

  # Base di mercato: ogni notte
  - type: cron
    name: collect-mercato
    runtime: python
    region: frankfurt
    schedule: "13 1 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dealfinder.pipeline.collect mercato
    envVars: *env
