# Configurazione Render (Blueprint). Regione Francoforte (UE).
# Le chiavi segrete (sync: false) si inseriscono nel pannello Render, mai qui.
envVarGroups:
  - name: dealfinder-secrets
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_SEARCHES
        sync: false
      - key: BRIGHTDATA_LIMIT
        value: "300"
      - key: BRIGHTDATA_UNLOCKER_ZONE
        sync: false
      - key: SCRAPER_PROXY
        sync: false
      - key: PLATE_LOOKUP_URL
        sync: false
      - key: PLATE_LOOKUP_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PLATE_SALT
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: dealfinder-db
    databaseName: dealfinder
    plan: basic-256mb
    region: frankfurt

services:
  # Sito Scovo (telefono) + API: https://scovo.onrender.com
  - type: web
    name: scovo
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dealfinder.init_db && uvicorn dealfinder.web.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'

    healthCheckPath: /health
    envVars:
      - fromGroup: dealfinder-secrets
      - key: DATABASE_URL
        fromDatabase: { name: dealfinder-db, property: connectionString }
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL                # indirizzo del sito (per Entra con Google/Apple)
        value: https://scovo.onrender.com
      - key: ISCRIZIONE                # approvazione (nuovi account attivati a mano) | aperta
        value: approvazione
      - key: MAX_DISPOSITIVI           # sessioni attive per account (telefono + computer)
        value: "2"
      - key: ANTHROPIC_API_KEY         # analisi AI (testo, foto, ricambi) e assistente: anche sui due cron
        sync: false
      - key: AI_BUDGET_GIORNO          # tetto di spesa AI al giorno in dollari: oltre, l'analisi riprende il giorno dopo
        value: "5"
      - key: OPENAI_API_KEY            # voce naturale dell'assistente (gpt-4o-mini-tts) e trascrizione
        sync: false
      - key: ELEVENLABS_API_KEY        # in alternativa: voce ElevenLabs
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: SERVIZI_LIMITE_GIORNO     # Vendi/Ricambi per commerciante al giorno
        value: "15"
      - key: SERVIZI_LIMITE_TOTALE     # tutto il sito al giorno (le ricerche targa costano)
        value: "150"

  # Nuovi annunci + filtro + approfondimento: ogni 3 ore (orari UTC)
  - type: cron
    name: dealfinder-opportunita
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "7 */3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dealfinder.pipeline.collect opportunita
    envVars:
      - fromGroup: dealfinder-secrets
      - key: DATABASE_URL
        fromDatabase: { name: dealfinder-db, property: connectionString }

  # Facebook Marketplace via Bright Data + analisi: due volte al giorno (ogni annuncio ha un costo)
  - type: cron
    name: dealfinder-facebook
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "37 6,16 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dealfinder.pipeline.collect facebook
    envVars:
      - fromGroup: dealfinder-secrets
      - key: DATABASE_URL
        fromDatabase: { name: dealfinder-db, property: connectionString }
      - key: FB_PARTE                  # prima metà delle ricerche (l'altra la fa dealfinder-facebook-2)
        value: "1/2"

  # Secondo account Bright Data: l'altra metà delle ricerche Facebook (chiave propria sul servizio)
  - type: cron
    name: dealfinder-facebook-2
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "47 6,16 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dealfinder.init_db && python -m dealfinder.pipeline.collect facebook --senza-analisi
    envVars:
      - fromGroup: dealfinder-secrets
      - key: DATABASE_URL
        fromDatabase: { name: dealfinder-db, property: connectionString }
      - key: FB_PARTE
        value: "2/2"
      - key: BRIGHTDATA_API_KEY         # chiave del SECONDO account (vince su quella del gruppo)
        sync: false

  # Base di mercato (Lombardia, fino a 40.000 €): ogni notte
  - type: cron
    name: dealfinder-mercato
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "13 1 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dealfinder.pipeline.collect mercato
    envVars:
      - fromGroup: dealfinder-secrets
      - key: DATABASE_URL
        fromDatabase: { name: dealfinder-db, property: connectionString }

  # Verifica disponibilità delle opportunità: ogni giorno
  - type: cron
    name: dealfinder-verifica
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "41 5 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dealfinder.pipeline.recheck
    envVars:
      - fromGroup: dealfinder-secrets
      - key: DATABASE_URL
        fromDatabase: { name: dealfinder-db, property: connectionString }

  # Misura della qualità delle stime: ogni lunedì
  - type: cron
    name: dealfinder-qualita
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "29 4 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m dealfinder.pricing.backtest
    envVars:
      - fromGroup: dealfinder-secrets
      - key: DATABASE_URL
        fromDatabase: { name: dealfinder-db, property: connectionString }
